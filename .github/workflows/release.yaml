name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.24"

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
        run: |
          GOARCH=amd64 go build \
            -o dist/superdaemon_linux_amd64 \
            -v -trimpath \
            -ldflags="-s -w -X superdaemon/system.Version=${{ github.ref_name }}" \
            superdaemon
          chmod 755 dist/superdaemon_linux_amd64

          GOARCH=arm64 go build \
            -o dist/superdaemon_linux_arm64 \
            -v -trimpath \
            -ldflags="-s -w -X superdaemon/system.Version=${{ github.ref_name }}" \
            superdaemon
          chmod 755 dist/superdaemon_linux_arm64

      - name: Checksums
        run: |
          cd dist && sha256sum superdaemon_linux_amd64 superdaemon_linux_arm64 > checksums.txt

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            dist/superdaemon_linux_amd64
            dist/superdaemon_linux_arm64
            dist/checksums.txt